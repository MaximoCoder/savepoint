name: Release APK

# Se ejecuta al subir un tag tipo v1.0.0, o a mano desde la pestaña Actions
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web
        run: npm run build

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Versión
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Restaurar la llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.SAVEPOINT_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Falta el secret SAVEPOINT_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks

      - name: Compilar APK firmado
        working-directory: android
        env:
          SAVEPOINT_KEYSTORE_PATH: release.jks
          SAVEPOINT_KEYSTORE_PASSWORD: ${{ secrets.SAVEPOINT_KEYSTORE_PASSWORD }}
          SAVEPOINT_KEY_ALIAS: ${{ secrets.SAVEPOINT_KEY_ALIAS }}
          SAVEPOINT_KEY_PASSWORD: ${{ secrets.SAVEPOINT_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          APK=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$APK" ]]; then
            echo "::error::No se generó un APK firmado. Revisa los secrets."
            exit 1
          fi
          cp "$APK" "../savePoint-${{ steps.version.outputs.name }}.apk"

      - name: Borrar la llave del runner
        if: always()
        run: rm -f android/release.jks

      - name: Huella SHA-256 del APK
        run: sha256sum savePoint-*.apk | tee savePoint.sha256

      - name: Publicar release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            savePoint-*.apk
            savePoint.sha256
          generate_release_notes: true

      - name: Guardar APK como artefacto (ejecución manual)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: savePoint-${{ steps.version.outputs.name }}
          path: savePoint-*.apk
          retention-days: 7
